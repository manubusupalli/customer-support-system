spring.application.name=backend

# Secrets are in application-local.properties (git-ignored); defaults here are non-functional placeholders
app.admin.username=admin
app.admin.password=changeme
spring.config.import=optional:application-local.properties

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/customer_support
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=changeme

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8081

# SameSite=Strict is the compensating control for CSRF being disabled (see SecurityConfig)
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
